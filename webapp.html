<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Alliance News</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   LIQUID GLASS — tokens. Light by default; dark via [data-theme=dark]
   (set from Telegram's colorScheme or the user's choice in «Моє»).
   ════════════════════════════════════════════════════════════════ */
:root{
  --font-display:'Geologica','Onest',-apple-system,sans-serif;
  --font:'Onest','Geologica',-apple-system,sans-serif;
  --bg:#FFFFFF;
  --ink:#0B1220; --ink-2:rgba(11,18,32,.66); --ink-3:rgba(11,18,32,.45);
  --hair:rgba(11,18,32,.08);
  /* solid surfaces: cards, elevated (sheets/bar), soft (chips, inputs) */
  --glass:#F4F5F8; --glass-strong:#FFFFFF; --glass-soft:#ECEEF2;
  --edge:rgba(11,18,32,.07); --rim-hi:transparent; --rim-lo:transparent;
  --shadow:none; --shadow-up:0 10px 30px -10px rgba(20,30,60,.25), 0 0 0 1px rgba(11,18,32,.06);
  --blue:#0A84FF; --teal:#1AA6C4; --indigo:#5E5CE6; --amber:#F59E0B; --violet:#AF52DE;
  --green:#16A34A; --red:#E5352B; --up:#16A34A; --down:#E5352B;
  --strike:#FF3B30; --strike-tint:rgba(255,59,48,.08);
  --chart-text:#5B6475; --chart-grid:rgba(11,18,32,.08); --chart-tip:#FFFFFF;
  --text:var(--ink); --sub:var(--ink-2); --muted:var(--ink-3); --border:var(--edge);
  --surface:var(--glass); --surface2:var(--glass-strong); --r:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
  /* top inset: device notch + Telegram's own header in fullscreen mode */
  --safe-t:max(env(safe-area-inset-top,0px), calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
}
:root[data-theme="dark"]{
  --bg:#000000;
  --ink:#F3F5FA; --ink-2:rgba(243,245,250,.68); --ink-3:rgba(243,245,250,.45);
  --hair:rgba(255,255,255,.08);
  --glass:#121317; --glass-strong:#1C1D22; --glass-soft:#24262C;
  --edge:rgba(255,255,255,.07);
  --shadow-up:0 10px 30px -10px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.07);
  --green:#30D158; --red:#FF453A; --up:#30D158; --down:#FF453A;
  --strike:#FF453A; --strike-tint:rgba(255,69,58,.12);
  --chart-text:#9AA3B5; --chart-grid:rgba(255,255,255,.07); --chart-tip:#1C1D22;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-size:15px;transition:background .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* Long unbroken words (product names, tracking numbers, URLs) must wrap
   instead of stretching cards past the screen edge. */
body{overflow-wrap:anywhere;word-break:normal}
.hero li>span,.srow>div,.mi .tx,.dg-item>div,.tb-row .nm,.rep-info,.trk-sv-info,.trk-del-info,.ai-head>div,
.card,.msg,.note,.hit,.facts dd,.wh-card,.curr-card,.pcard,.stat,.dept{min-width:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}

/* ── Surfaces (flat — no blur: blur on every card made scrolling lag) ── */
.glass{position:relative;background:var(--glass);border-radius:26px;box-shadow:inset 0 0 0 1px var(--edge)}
.glass.strong{background:var(--glass-strong)}

/* ── SPLASH: pulsing logo ── */
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;
  background:var(--bg);transition:opacity .5s ease;overflow:hidden}
.sp-logo-img{width:62vw;max-width:320px;height:auto;object-fit:contain;z-index:2;position:relative;
  animation:logo-pulse 2s ease-in-out infinite;filter:drop-shadow(0 20px 40px rgba(0,0,0,.18))}
@keyframes logo-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.85}}

/* ── APP SHELL ── */
#app{position:fixed;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s}
#app.on{opacity:1;visibility:visible;pointer-events:auto}
@keyframes forceShowApp{to{opacity:1;visibility:visible;pointer-events:auto}}
@keyframes forceHideSplash{to{opacity:0;visibility:hidden;pointer-events:none}}
#app{animation:forceShowApp .1s linear 4s forwards}
#splash{animation:forceHideSplash .1s linear 4s forwards}
body.boot-fallback #app{opacity:1!important;visibility:visible!important;pointer-events:auto!important}
body.boot-fallback #splash{display:none!important}
.safe-mode-msg{display:none;position:relative;z-index:5;font-size:12.5px;text-align:center;padding:8px 16px;color:var(--ink-2)}
body.boot-error .safe-mode-msg{display:block}

.views{position:absolute;inset:0;z-index:2;max-width:720px;margin:0 auto}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(14px + var(--safe-t)) 16px calc(130px + var(--safe-b));
  scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .2s}
.view::-webkit-scrollbar{display:none}
.view.on{opacity:1;pointer-events:auto}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* ── Headers ── */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 4px 16px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.title{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.035em;line-height:1.05}
.icon-btns{display:flex;gap:8px;flex-shrink:0}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:16px}
.ibtn svg{width:19px;height:19px}
.ibtn.active{background:var(--ink);color:var(--bg)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec h3{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:-.02em}
.sec a,.link{font-size:13.5px;font-weight:600;color:var(--blue);cursor:pointer}
.backrow{display:flex;gap:8px;margin:4px 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:99px;font-size:13.5px;font-weight:600}

/* ── Pills, chips, inputs ── */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;border-radius:99px;font-size:13.5px;font-weight:600;text-decoration:none}
.pill.primary{background:var(--ink);color:var(--bg)}
.pill.ghost{background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--edge)}
.pill.danger{background:var(--red);color:#fff}
.pill.block{display:flex;width:100%;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .25s;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.on::before{display:none}
.chips.sub .chip{padding:6px 11px;font-size:12.5px}
.search{display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:18px;margin-bottom:12px}
.search svg{width:17px;height:17px;opacity:.5;flex-shrink:0}
.search input{border:0;outline:0;background:none;width:100%;font-size:15px}
.field{width:100%;padding:13px 15px;border-radius:16px;border:0;outline:0;background:var(--glass-soft);
  box-shadow:inset 0 0 0 1px var(--edge);font-size:15px}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
select.field{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select.field option{color:#111}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:13.5px;border-radius:22px;line-height:1.5}
.empty .ei{font-size:34px;margin-bottom:6px}
.sk{border-radius:22px;background:linear-gradient(90deg,var(--glass-soft) 25%,var(--glass) 50%,var(--glass-soft) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-card{height:110px;margin-bottom:10px}.sk-tile{height:92px;min-width:128px}.sk-rep{height:68px;margin-bottom:10px}
.sk-ch{height:200px;margin-bottom:10px}

/* ── Today ── */
.hero{padding:18px 18px 16px;border-radius:30px}
.hero .when{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.18);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
.hero h2{font-family:var(--font-display);font-weight:650;font-size:22px;line-height:1.18;letter-spacing:-.025em;margin:10px 0 12px}
.hero ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.hero li{display:flex;gap:10px;font-size:14px;line-height:1.4;color:var(--ink-2);padding:6px 0;cursor:pointer}
.hero li b{color:var(--ink);font-weight:600}
.hero li .k{flex-shrink:0;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;margin-top:1px}
.hero li .go{margin-left:auto;color:var(--ink-3);flex-shrink:0;padding-left:6px}
.hero .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.strike-card{padding:14px 16px;border-radius:24px;background:linear-gradient(180deg,var(--strike-tint),transparent 70%),var(--glass)}
.strike-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.strike-head .lbl{font-weight:700;font-family:var(--font-display);font-size:15px}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--strike);color:#fff}
.srow{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--hair);cursor:pointer}
.srow:first-of-type{border-top:0}
.srow .mark{width:4px;border-radius:4px;background:var(--strike);flex-shrink:0}
.srow .mark.soft{background:var(--amber)}
.srow .t{font-size:14px;font-weight:600;line-height:1.3}
.srow .m{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.tile{min-width:132px;padding:13px 14px;border-radius:22px;scroll-snap-align:start;flex-shrink:0;cursor:pointer}
.tile .n{font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tile .v{font-family:var(--font-display);font-weight:650;font-size:20px;letter-spacing:-.02em;margin:5px 0 6px;font-variant-numeric:tabular-nums}
.chg{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.chg.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.chg.flat{color:var(--ink-3);background:var(--hair)}
.fx{display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:22px;cursor:pointer}
.fx div{padding:10px 4px;text-align:center}
.fx div+div{border-left:1px solid var(--hair)}
.fx .c{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.fx .r{font-family:var(--font-display);font-weight:600;font-size:16px;margin-top:3px;font-variant-numeric:tabular-nums}
.depts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dept{padding:14px;border-radius:22px;cursor:pointer;min-height:118px;display:flex;flex-direction:column;transition:transform .2s}
.dept:active{transform:scale(.97)}
.dept .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.dept .nm{font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.dept .ct{font-size:12px;font-weight:700;color:var(--ink-3)}
.dept .last{font-size:12.5px;color:var(--ink-2);line-height:1.35;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── Cards ── */
.list{display:flex;flex-direction:column;gap:10px}
.card{padding:15px 16px 12px;border-radius:24px;cursor:pointer}
.card .meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-3);flex-wrap:wrap}
.card .cat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.card .cat i{width:8px;height:8px;border-radius:50%}
.card h4{font-family:var(--font-display);font-weight:600;font-size:16.5px;line-height:1.28;letter-spacing:-.015em;margin:8px 0 6px}
.card p{font-size:13.5px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .acts{display:flex;gap:2px;margin-top:10px;margin-left:-8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.act svg{width:16px;height:16px}
.act.on{color:var(--amber)}
.act.noted{color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:20px}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.03em}
.stat .l{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;line-height:1.25}
.stat.red .v{color:var(--strike)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters .field{flex:1;min-width:0;padding:10px 30px 10px 13px;font-size:13.5px}
.timeline{position:relative;padding-left:22px;margin-top:6px}
.timeline::before{content:'';position:absolute;left:7px;top:10px;bottom:10px;width:2px;border-radius:2px;
  background:linear-gradient(var(--strike),color-mix(in srgb,var(--strike) 10%,transparent))}
.tl{position:relative;margin-bottom:10px}
.tl::before{content:'';position:absolute;left:-20px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--strike);box-shadow:0 0 0 4px var(--bg)}
.tl.soft::before{background:var(--amber)}
.tl .card h4{font-size:15.5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px;margin-top:8px}
.facts dt{color:var(--ink-3);font-weight:600}
.facts dd{color:var(--ink-2)}
.ptag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--strike-tint);color:var(--strike)}

/* ── Me ── */
.me-head{display:flex;align-items:center;gap:14px;padding:16px;border-radius:26px}
.ava{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:21px;
  color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));overflow:hidden;flex-shrink:0}
.ava img{width:100%;height:100%;object-fit:cover}
.menu{border-radius:24px;padding:4px 0;overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;min-height:56px}
.mi+.mi{border-top:1px solid var(--hair)}
.mi .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.mi .ic svg{width:18px;height:18px}
.mi .tx{flex:1;font-weight:600;font-size:15px;min-width:0}
.mi .tx small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .cnt{font-size:13px;font-weight:600;color:var(--ink-3)}
.chev{width:8px;height:8px;border-right:2px solid var(--ink-3);border-top:2px solid var(--ink-3);transform:rotate(45deg);flex-shrink:0}
.toggle{width:51px;height:31px;border-radius:99px;background:var(--hair);position:relative;transition:background .25s;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--edge)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--edge)}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.note{padding:14px 16px;border-radius:20px;cursor:pointer}
.note .d{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.note .b{font-size:14px;line-height:1.45;margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note .ref{font-size:12px;color:var(--blue);margin-top:6px;font-weight:600}
.secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.secbtn{padding:14px 8px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.secbtn svg{width:22px;height:22px}
/* toolbar editor */
.tb-preview{display:flex;gap:6px;padding:6px;border-radius:24px;margin-bottom:10px}
.tb-preview span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:18px;font-size:10.5px;font-weight:600;color:var(--ink-2)}
.tb-preview span svg{width:20px;height:20px}
.tb-preview span.pin{background:var(--glass-strong)}
.tb-row{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;min-height:54px}
.tb-row+.tb-row{border-top:1px solid var(--hair)}
.tb-row .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--glass-soft)}
.tb-row .ic svg{width:17px;height:17px}
.tb-row .nm{flex:1;font-weight:600;font-size:14.5px}
.tb-row .nm small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.tbb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--ink-2)}
.tbb:disabled{opacity:.25;cursor:default}
.tbb.rm{color:#fff;background:var(--red)}
.tbb.add{color:#fff;background:var(--green)}
.hint{font-size:12.5px;color:var(--ink-3);margin:8px 4px 0;line-height:1.45}

/* ── Floating tab bar with sliding liquid lens ── */
.tabbar{position:fixed;left:max(12px,calc(50% - 350px));right:max(84px,calc(50% - 278px));background:var(--glass-strong)!important;box-shadow:var(--shadow-up)!important;bottom:calc(18px + var(--safe-b));height:66px;border-radius:33px;z-index:30;display:flex;padding:5px}
.lens{position:absolute;top:5px;bottom:5px;left:5px;border-radius:28px;z-index:0;background:var(--glass-soft);
  transition:transform .55s cubic-bezier(.3,1.35,.45,1),width .55s cubic-bezier(.3,1.35,.45,1)}
.tab{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--ink-3);transition:color .3s;white-space:nowrap}
.tab svg{width:22px;height:22px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tab.on{color:var(--ink)}
.tab.on svg{transform:scale(1.08)}
.tab .dotn{position:absolute;top:8px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--strike);box-shadow:0 0 0 2px var(--bg)}

/* ── AI button: a separate round button next to the bar, the robot fills it ── */
.orb{position:fixed;right:max(12px,calc(50% - 350px));bottom:calc(18px + var(--safe-b));width:66px;height:66px;border-radius:50%;z-index:30;
  display:grid;place-items:center;background:none;padding:0}
.orb svg{width:66px;height:66px;filter:drop-shadow(0 8px 14px rgba(47,91,255,.35))}
.orb:active svg{transform:scale(.94)}
.rb .eye{transform-box:fill-box;transform-origin:center;animation:rbBlink 4.2s infinite}
.rb .ant{animation:rbGlow 2s ease-in-out infinite}
.rb.think .eye{animation:rbScan .9s ease-in-out infinite alternate}
.rb.think .ant{animation-duration:.6s}
.rb.happy{animation:rbHop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes rbBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rbGlow{50%{opacity:.35}}
@keyframes rbScan{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
@keyframes rbHop{30%{transform:translateY(-4px)}}

/* ── Sheets, overlays ── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{box-shadow:var(--shadow-up)!important;position:fixed;left:max(8px,calc(50% - 352px));right:max(8px,calc(50% - 352px));bottom:calc(8px + var(--safe-b));max-height:90%;z-index:50;border-radius:34px;
  display:flex;flex-direction:column;transform:translateY(115%);transition:transform .55s cubic-bezier(.2,1.1,.3,1)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--ink-3);opacity:.5;margin:9px auto 4px;flex-shrink:0}
.sheet .body{overflow-y:auto;padding:8px 20px 24px;scrollbar-width:none;flex:1}
.sheet .body::-webkit-scrollbar{display:none}
.sheet h2{font-family:var(--font-display);font-weight:650;font-size:22px;line-height:1.2;letter-spacing:-.025em;margin:8px 0 10px}
.sheet .txt{font-size:15px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap}
.sheet textarea{width:100%;min-height:96px;border-radius:18px;padding:12px 14px;border:0;outline:0;background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--edge);resize:none;font-size:14.5px;line-height:1.45}
.sheet .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.srcs a{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink-2);text-decoration:none}
.overlay{position:fixed;inset:0;z-index:45;padding:calc(16px + var(--safe-t)) 16px 20px;display:flex;flex-direction:column;
  background:var(--bg);
  opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:auto}
.overlay>*{max-width:688px;width:100%;margin-left:auto;margin-right:auto}
.overlay .bar{display:flex;gap:10px;align-items:center}
.overlay .bar .search{flex:1;margin:0}
.overlay .res{overflow-y:auto;margin-top:14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;flex:1}
.hit{padding:12px 14px;border-radius:18px;cursor:pointer}
.hit .k{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.hit .t{font-size:14.5px;font-weight:600;line-height:1.3;margin-top:3px}
.hit mark{background:color-mix(in srgb,var(--amber) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sugg button{font-size:13px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--edge);text-align:left}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);z-index:90;padding:10px 16px;border-radius:99px;
  font-size:13.5px;font-weight:600;opacity:0;transition:all .35s cubic-bezier(.2,1.2,.3,1);white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── AI chat ── */
.ai-head{display:flex;align-items:center;gap:12px;margin-top:2px}
.ai-head .rb{width:64px;height:64px;flex-shrink:0;filter:drop-shadow(0 8px 16px rgba(47,91,255,.3))}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--edge);border-bottom-left-radius:6px}
.msg.ai b{font-weight:700}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;vertical-align:1px;cursor:pointer;margin:0 1px}
.msrc{display:flex;flex-direction:column;gap:4px;margin-top:8px;white-space:normal}
.msrc button{text-align:left;font-size:12.5px;font-weight:600;color:var(--blue)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:4px;animation:blinkdot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blinkdot{50%{opacity:.25}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 8px 8px 16px;border-radius:26px;margin:6px 12px 12px}
.composer textarea{flex:1;border:0;outline:0;background:none;font-size:15px;resize:none;max-height:110px;line-height:1.4;padding:8px 0}
.send{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex-shrink:0}
.send:disabled{opacity:.4}
.sheet .composer textarea{min-height:0;height:auto;border-radius:0;padding:8px 0;background:none;box-shadow:none}
.ai-head>div{flex:1}
.tts-auto{width:40px;height:40px;border-radius:50%;background:var(--glass-soft);font-size:18px;flex-shrink:0}
.tts-auto.on{background:var(--blue)}
.speak{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--blue);white-space:normal}
.speak.on{color:var(--red)}
.mic{width:38px;height:38px;border-radius:50%;background:var(--glass-soft);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.mic.rec{background:var(--red);color:#fff;animation:recPulse 1.2s ease-in-out infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(229,53,43,.45)}50%{box-shadow:0 0 0 8px rgba(229,53,43,0)}}
.composer textarea:disabled{opacity:1;color:var(--red)}

/* ════════ Ported modules, restyled ════════ */
/* Markets */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;padding:13px 14px;border-radius:22px;cursor:pointer;transition:transform .2s}
.pcard:active{transform:scale(.98)}
.pcico{font-size:20px;margin-bottom:4px}
.pclbl{font-size:12px;color:var(--ink-2);line-height:1.3;margin-bottom:8px;min-height:31px}
.pcval{font-family:var(--font-display);font-size:19px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pcunit{font-size:11px;font-weight:500;color:var(--ink-3);font-family:var(--font)}
.pcchg{margin-top:6px}
.pcard-del{display:none;position:absolute;top:8px;right:8px;width:22px;height:22px;background:var(--red);color:#fff;border-radius:50%;font-size:11px;line-height:1;align-items:center;justify-content:center;z-index:2}
body.mk-edit .pcard-del{display:flex}
body.mk-edit .pcard{cursor:default;animation:jiggle .35s ease-in-out infinite alternate}
@keyframes jiggle{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.pcard.editable{cursor:grab;touch-action:none}
.pcard.dragging{opacity:.65;transform:scale(.97)}
.pcard.drag-over{box-shadow:var(--shadow),inset 0 0 0 2px var(--blue)}
.mk-detail{display:none;flex-direction:column}
.mk-detail.on{display:flex}
.chcard{padding:16px;border-radius:24px;margin-bottom:6px}
.chtitle{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display)}
/* modal list (markets / currencies) */
.mk-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mk-modal-ov.on{display:flex}
.mk-modal{box-shadow:var(--shadow-up)!important;width:100%;max-width:704px;margin:0 8px calc(8px + var(--safe-b));max-height:80vh;display:flex;flex-direction:column;border-radius:34px;animation:sheetin .5s cubic-bezier(.2,1.1,.3,1)}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
.mk-modal-top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.mk-modal-ttl{font-size:17px;font-weight:700;font-family:var(--font-display)}
.mk-modal-x{font-size:24px;color:var(--ink-3);line-height:1}
.mk-modal-srch{margin:8px 16px;width:calc(100% - 32px)}
.mk-modal-list{overflow-y:auto;flex:1;padding:4px 16px 8px;display:flex;flex-direction:column;gap:7px}
.mk-mi{padding:11px 13px;border-radius:16px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--glass-soft);box-shadow:inset 0 0 0 1px var(--edge)}
.mk-mi.on{box-shadow:inset 0 0 0 1.5px var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.mk-mi-ico{font-size:20px;min-width:24px;text-align:center}
.mk-mi-lbl{font-size:13.5px;font-weight:600;flex:1}
.mk-mi-chk{font-size:16px;color:var(--green);display:none}
.mk-mi.on .mk-mi-chk{display:block}
.mk-modal-footer{padding:10px 16px 16px}
/* Currencies */
.curr-list.compact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.curr-list.chart{display:flex;flex-direction:column;gap:10px}
.curr-footer{font-size:11.5px;color:var(--ink-3);padding:10px 4px;text-align:right}
.curr-card{position:relative;padding:13px 14px;border-radius:22px}
.curr-code{font-size:15px;font-weight:700;font-family:var(--font-display)}
.curr-name{font-size:11.5px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.curr-rate{font-family:var(--font-display);font-size:20px;font-weight:650;margin-top:8px;font-variant-numeric:tabular-nums}
.curr-label{font-size:11px;color:var(--ink-3);margin-top:1px}
.curr-chart-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.curr-chart-code{font-size:15px;font-weight:700;font-family:var(--font-display)}
.curr-chart-name{font-size:11.5px;color:var(--ink-3)}
.curr-chart-rate{font-family:var(--font-display);font-size:18px;font-weight:650}
.curr-chart-area{position:relative;height:100px;margin-top:4px}
.curr-chart-area canvas{width:100%!important}
.curr-chart-fallback{display:flex;align-items:center;justify-content:center;height:80px;color:var(--ink-3);font-size:12px}
.curr-remove-btn{display:none;position:absolute;top:8px;right:8px;width:22px;height:22px;background:var(--red);color:#fff;border-radius:50%;font-size:11px;align-items:center;justify-content:center;z-index:2}
body.curr-edit .curr-remove-btn{display:flex}
/* Reports */
.rep-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px}
.rep-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--glass-soft);flex-shrink:0}
.rep-info{flex:1;min-width:0}
.rep-type{font-size:14.5px;font-weight:700}
.rep-date{font-size:12px;color:var(--ink-3);margin-top:2px}
.dg-item{display:flex;gap:12px;padding:13px 16px;cursor:pointer;align-items:flex-start}
.dg-item+.dg-item{border-top:1px solid var(--hair)}
.dg-item .k{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.dg-item .t{font-weight:600;font-size:14.5px;line-height:1.3}
.dg-item .s{font-size:13px;color:var(--ink-2);line-height:1.45;margin-top:3px}
/* Warehouse */
.wh-list{display:flex;flex-direction:column;gap:10px}
.wh-card{padding:14px 16px;border-radius:22px;cursor:pointer}
.wh-card-name{font-size:15px;font-weight:700;font-family:var(--font-display)}
.wh-card-cat{font-size:12px;color:var(--ink-3);margin-top:2px}
.wh-card-desc{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.wh-detail{display:none;flex-direction:column}
.wh-detail.on{display:flex}
.wh-det-row{padding:12px 15px;border-radius:20px;margin-bottom:8px}
.wh-det-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:4px}
.wh-det-val{font-size:14px;line-height:1.5}
/* «Вантажі компанії» */
.corp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.corp-stats .stat{padding:11px 10px;cursor:pointer}
.corp-stats .stat .v{font-size:23px}
.corp-stats .stat.red .v{color:var(--red)}
.corp-stats .stat.on{box-shadow:inset 0 0 0 2px var(--ink)}
.corp .route{font-size:13.5px;color:var(--ink-2);margin-top:-2px}
.corp .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.corp .num{font-size:12.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.corp .st{margin-top:8px;font-size:13px;-webkit-line-clamp:2}
.eta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;
  background:var(--glass-soft);color:var(--ink-2);white-space:nowrap}
.eta.soon{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.eta.late{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.eta.arr{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.eta.done{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
/* Tracking */
.trk-wrap{display:flex;flex-direction:column}
.trk-screen{display:none;flex-direction:column}
.trk-screen.active{display:flex}
.trk-big-wrap{display:flex;flex-direction:column;gap:12px}
.trk-big-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:26px;min-height:150px;padding:20px}
.trk-big-ico{font-size:42px;line-height:1}
.trk-big-title{font-size:19px;font-weight:700;font-family:var(--font-display)}
.trk-big-sub{font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.4}
.trk-nav-row{display:flex;gap:8px;margin-bottom:14px}
.trk-nav-back{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:14px;
  background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);align-self:flex-start}
.trk-nav-row .trk-nav-back{margin-bottom:0}
.trk-carriers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.trk-car-btn{padding:12px 8px;border-radius:16px;font-size:13.5px;font-weight:600;text-align:center;color:var(--ink-2);
  background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge)}
.trk-car-btn.on{background:var(--ink);color:var(--bg);box-shadow:none}
.trk-input-row{display:flex;flex-direction:column;gap:10px}
.trk-input{width:100%;padding:14px 16px;border-radius:16px;border:0;outline:0;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);font-size:15px;
  }
.trk-input:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
.trk-go{width:100%;padding:15px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:700}
.trk-loading{display:flex;flex-direction:column;align-items:center;padding:40px 20px 30px;gap:20px}
.trk-radar{position:relative;width:80px;height:80px}
.trk-radar-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--blue);animation:trk-ping 1.8s ease-out infinite}
.trk-radar-ring:nth-child(2){animation-delay:.6s}.trk-radar-ring:nth-child(3){animation-delay:1.2s}
@keyframes trk-ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.trk-radar-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:38px}
.trk-loading-txt{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.trk-result{margin-top:14px}
.trk-error,.trk-delivery,.trk-carrier-banner,.trk-auto-refresh{padding:14px 16px;border-radius:22px;margin-bottom:12px;
  background:var(--glass);box-shadow:var(--shadow),inset 0 0 0 1px var(--edge)}
.trk-error{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.trk-error strong{color:var(--ink);display:block;margin-bottom:6px}
.trk-error code{font-size:11.5px;color:var(--blue);display:block;margin-top:8px;word-break:break-all}
.trk-delivery{display:flex;align-items:center;gap:12px}
.trk-del-ico{font-size:28px;flex-shrink:0}
.trk-del-info{flex:1;min-width:0}
.trk-del-label{font-size:12px;color:var(--ink-3);margin-bottom:4px;line-height:1.4}
.trk-del-date{font-size:16px;font-weight:700}
.trk-carrier-banner{border-left:4px solid var(--edge)}
.trk-carrier-bname{font-size:21px;font-weight:800;margin-bottom:6px;font-family:var(--font-display)}
.trk-carrier-bnum{font-size:12px;color:var(--ink-3);margin-bottom:4px;font-variant-numeric:tabular-nums}
.trk-carrier-bstat{font-size:14.5px;font-weight:600}
.trk-open-btn,.trk-refresh-btn,.trk-save-btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:99px;font-size:14px;font-weight:700;text-align:center;
  background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);}
.trk-save-btn{background:var(--green);color:#fff;box-shadow:none}
.trk-save-btn:disabled,.trk-refresh-btn:disabled{opacity:.5}
.trk-auto-refresh{font-size:12.5px;color:var(--ink-2);text-align:center}
.trk-timeline{display:flex;flex-direction:column;margin:6px 0 4px;padding:14px 14px 0;border-radius:22px;background:var(--glass);
  box-shadow:inset 0 0 0 1px var(--edge)}
.trk-step{display:flex;align-items:flex-start;gap:13px;position:relative;min-height:70px}
.trk-step:not(:last-child)::before{content:'';position:absolute;left:17px;top:37px;width:2px;bottom:0;background:var(--hair)}
.trk-dot{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:1;position:relative;margin-top:2px}
.trk-dot.done{background:color-mix(in srgb,var(--green) 18%,transparent);box-shadow:inset 0 0 0 2px var(--green)}
.trk-dot.active{background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 20%,transparent)}
.trk-dot.fail{background:color-mix(in srgb,var(--red) 18%,transparent);box-shadow:inset 0 0 0 2px var(--red)}
.trk-dot.pending{background:var(--glass-soft);box-shadow:inset 0 0 0 2px var(--edge)}
.trk-step-info{padding:4px 0 18px;flex:1;min-width:0}
.trk-step-title{font-size:14px;font-weight:600;margin-bottom:3px;line-height:1.35}
.trk-step-title.dim{color:var(--ink-3)}
.trk-step-time{font-size:12px;font-weight:600;color:var(--green);margin-bottom:2px;font-variant-numeric:tabular-nums}
.trk-step-desc{font-size:12px;color:var(--ink-2);line-height:1.45}
.trk-sec-hdr{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:6px 4px 10px;display:flex;align-items:center;gap:6px}
.trk-sec-cnt{font-size:11px;font-weight:700;background:var(--glass-soft);padding:2px 7px;border-radius:20px}
.trk-saved-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.trk-sv-card{padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;border-radius:22px;
  background:var(--glass);box-shadow:var(--shadow),inset 0 0 0 1px var(--edge)}
.trk-sv-card.arc{opacity:.65}
.trk-sv-ico{font-size:22px;flex-shrink:0}
.trk-sv-info{flex:1;min-width:0}
.trk-sv-num{font-size:14px;font-weight:700;margin-bottom:2px}

/* pull-to-refresh + offline */
.ptr{position:fixed;left:50%;top:calc(6px + var(--safe-t));z-index:80;width:38px;height:38px;margin-left:-19px;border-radius:50%;

<!-- EARLY BOOT FALLBACK: runs before the main bundle -->
<script>
(function(){
  function _earlyShow(){
    try{
      document.body.classList.add('boot-fallback');
      var a=document.getElementById('app'),s=document.getElementById('splash');
      if(a){a.classList.add('on');}
      if(s){s.style.display='none';}
    }catch(e){}
  }
  setTimeout(_earlyShow,4000);
  // theme before first paint: Telegram scheme or system
  try{
    var tw=window.Telegram&&window.Telegram.WebApp;
    var dark=tw&&tw.colorScheme?tw.colorScheme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
    var saved=localStorage.getItem('an_theme');
    if(saved==='dark'||saved==='light') dark=saved==='dark';
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  }catch(e){}
})();
</script>

<script>
// ── Telegram ──────────────────────────────────────────────────
const tg = window.Telegram?.WebApp;

// ── Signed-request wrapper ────────────────────────────────────
// Attach the Telegram-signed initData to every same-origin /api call so the
// backend can verify the user identity (HMAC) instead of trusting a raw
// user_id from the client. initData is only valid when launched in Telegram.
(function(){
  const _initData = tg?.initData || '';
  const _origFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    try{
      const url = (typeof input === 'string') ? input : (input && input.url) || '';
      const isApi = url.startsWith('/api/') || url.includes('/api/webapp/');
      if(isApi && _initData){
        init = init ? Object.assign({}, init) : {};
        const h = new Headers(init.headers || {});
        h.set('X-Telegram-Init-Data', _initData);
        init.headers = h;
      }
    }catch(e){ /* fall through to plain fetch */ }
    return _origFetch(input, init);
  };
})();

// ── Offline cache: keep the last good copy of the main API responses on the
// phone; when the network is down, serve it and show «📴 Офлайн».
const _CACHE_RX = /\/api\/webapp\/(news\?limit=80|strikes\?|digest\/latest|currencies$|markets$|track\/corporate|favorites|notes|user\/app-prefs|user\/subscriptions|digest_reports)/;
(function(){
  const _f = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const url = (typeof input === 'string') ? input : (input && input.url) || '';
    const method = ((init && init.method) || 'GET').toUpperCase();
    const key = url.replace(/[?&]user_id=\d+/, '');
    if(method !== 'GET' || !_CACHE_RX.test(key)) return _f(input, init);
    try{
      const r = await _f(input, init);
      if(r.ok){
        r.clone().text().then(t => { try{ if(t.length < 400000) localStorage.setItem('c:' + key, JSON.stringify({t: Date.now(), b: t})); }catch{} });
        setOffline(false);
      }
      return r;
    }catch(e){
      let c = null; try{ c = JSON.parse(localStorage.getItem('c:' + key) || 'null'); }catch{}
      if(c){ setOffline(true, c.t); return new Response(c.b, {status: 200, headers: {'Content-Type': 'application/json'}}); }
      setOffline(true);
      throw e;
    }
  };
})();
function setOffline(on, ts){
  const el = document.getElementById('offline'); if(!el) return;
  if(!on){ el.classList.remove('on'); return; }
  const when = ts ? new Date(ts).toLocaleString(lang === 'en' ? 'en-US' : 'uk-UA', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
  el.textContent = (lang === 'en' ? '📴 Offline' : '📴 Офлайн') + (when ? (lang === 'en' ? ' — data from ' : ' — дані від ') + when : '');
  el.classList.add('on');
}
window.addEventListener('offline', () => setOffline(true));
window.addEventListener('online', () => setOffline(false));

if(tg){
  tg.ready();
  tg.expand();
  tg.disableVerticalSwipes?.();
  try{
    if(['ios','android','android_x'].includes(tg.platform) && tg.isVersionAtLeast?.('8.0') && !tg.isFullscreen) tg.requestFullscreen();
  }catch(e){}
  tg.onEvent?.('fullscreenChanged', () => setTimeout(moveLens, 50));
  tg.onEvent?.('viewportChanged', () => setTimeout(handleAppViewportResize, 120));
  tg.onEvent?.('themeChanged', () => { if(PREFS.theme === 'auto') applyTheme(); });
  tg.BackButton?.onClick?.(() => back());
}

// ── DOM helpers ───────────────────────────────────────────────
function byId(id){ return document.getElementById(id); }
function setText(id,v){ const e=byId(id); if(e) e.textContent=v; }
function setHTML(id,v){ const e=byId(id); if(e) e.innerHTML=v; }
function showEl(id,d){ const e=byId(id); if(e) e.style.display=(d===undefined?'':d); }
function addCls(id,c){ const e=byId(id); if(e) e.classList.add(c); }
function rmCls(id,c){ const e=byId(id); if(e) e.classList.remove(c); }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const val = v => (v && !['null','none','невідомо','unknown','-'].includes(String(v).trim().toLowerCase())) ? String(v) : '';
function hap(kind){ try{ kind==='ok' ? tg?.HapticFeedback?.notificationOccurred('success') : tg?.HapticFeedback?.impactOccurred(kind||'light'); }catch{} }
function openExt(url){ if(!url) return; if(tg) tg.openLink(url); else window.open(url, '_blank', 'noopener'); }
function uid(){ const u = tg?.initDataUnsafe?.user?.id; if(u) return u;
  let l = localStorage.getItem('trk_uid'); if(!l){ l = String(Date.now()); localStorage.setItem('trk_uid', l); } return parseInt(l); }

// ── Time ──────────────────────────────────────────────────────
function parseTs(pub){
  if(!pub) return null;
  if(pub instanceof Date) return pub;
  const s = String(pub);
  const d = new Date(s.includes('T') ? s : s.replace(' ','T') + (s.includes('+') ? '' : '+03:00'));
  return isNaN(d) ? null : d;
}
function ago(pub){
  const dt = parseTs(pub); if(!dt) return '';
  const s = (Date.now() - dt) / 1000;
  if(s < 60) return T('ago_now');
  if(s < 3600) return Math.floor(s/60) + ' ' + T('ago_m');
  if(s < 86400) return Math.floor(s/3600) + ' ' + T('ago_h');
  return dt.toLocaleDateString(LOCALE(), {day:'numeric', month:'short'});
}

function go(v, opts){

async function toggleFav(kind, id){

  const obj = kind === 'news' ? (NEWS[id] || FAVS[k]?.data) : (STRIKES[id] || FAVS[k]?.data);
  if(!obj) return;
  if(was) delete FAVS[k]; else FAVS[k] = {kind, ref_id:id, data: kind==='news' ? newsSnapshot(obj) : strikeSnapshot(obj)};

  try{ await fetch('/api/webapp/favorites/toggle', {method:'POST', headers:{'Content-Type':'application/json'},

}

}

let TODAY = {news: [], strikes: [], digest: null, fx: null};
async function loadToday(){
  loaded.today = true;
  const now = new Date();
  setText('todayDate', now.toLocaleDateString(LOCALE(), {weekday:'long', day:'numeric', month:'long'}).replace(/^./, c => c.toUpperCase()));
  const get = async u => { try{ return await (await fetch(u)).json(); }catch{ return null; } };
  const [news, strikes, digest, fx] = await Promise.all([
    get('/api/webapp/news?limit=80'), get('/api/webapp/strikes?days=30&limit=60'),
    get('/api/webapp/digest/latest'), get('/api/webapp/currencies')]);
  TODAY.news = Array.isArray(news) ? news : []; TODAY.news.forEach(a => NEWS[a.id] = a);
  TODAY.strikes = strikes?.events || []; TODAY.strikes.forEach(e => STRIKES[e.id] = e);
  TODAY.digest = digest?.issue || null; TODAY.fx = fx && fx.ok ? fx : null;
  renderHero(); renderTodayStrikes(); renderTodayFx(); renderTodayDepts(); renderTodayLatest();
  const recent = TODAY.strikes.filter(e => Date.now() - parseTs(e.sent_at) < 864e5).length;
  const dot = byId('strikeDot'); if(dot) dot.style.display = recent ? '' : 'none';
  if(!mkData.length) fetchMarkets().then(renderTodayMarkets); else renderTodayMarkets();
}

async function fetchFeed(reset){

function ttsVoice(){

function speakText(idx){

// ── Voice questions: record → /api/webapp/transcribe → askAI ──
let _rec = null, _recChunks = [], _recStart = 0, _recTimer = null;
async function toggleRec(){
  if(_rec){ _rec.stop(); return; }
  if(_aiBusy) return;
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast(T('micNo')); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio: true}); }catch{ toast(T('micDenied')); return; }
  const type = ['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm']
    .find(t => window.MediaRecorder.isTypeSupported?.(t)) || '';
  try{ _rec = new MediaRecorder(stream, type ? {mimeType: type} : undefined); }
  catch{ stream.getTracks().forEach(t => t.stop()); toast(T('micNo')); return; }
  _recChunks = [];
  _rec.ondataavailable = e => { if(e.data && e.data.size) _recChunks.push(e.data); };
  _rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(_recTimer);
    const mime = (_rec.mimeType || type || 'audio/webm');
    const tooShort = Date.now() - _recStart < 700;
    _rec = null; setRecUI(false);
    const blob = new Blob(_recChunks, {type: mime});
    if(tooShort || blob.size < 1000) return;
    await sendVoice(blob, mime);
  };
  _rec.start(250); _recStart = Date.now(); setRecUI(true); hap('medium');
  _recTimer = setInterval(() => {
    const sec = Math.floor((Date.now() - _recStart) / 1000);
    byId('aiQ').placeholder = '🔴 ' + T('recording') + ' ' + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
    if(sec >= 120 && _rec) _rec.stop();
  }, 250);
}
function setRecUI(on){
  byId('aiMic').classList.toggle('rec', on);
  const q = byId('aiQ'); q.disabled = on; if(!on) q.placeholder = T('aiPh');
}
async function sendVoice(blob, mime){
  const chat = byId('chat'), body = byId('aiBody');
  chat.insertAdjacentHTML('beforeend', '<div class="msg me typing" id="voiceMsg">🎤 <span></span><span></span><span></span></div>');
  body.scrollTop = 1e6; setHarvey('thinking');
  try{
    const r = await fetch('/api/webapp/transcribe?lang=' + lang + '&user_id=' + uid(), {method:'POST', headers:{'Content-Type': mime.split(';')[0]}, body: blob});
    const d = await r.json();
    byId('voiceMsg')?.remove();
    const text = (d.text || '').trim();
    if(!text){ setHarvey(null); toast(T('voiceEmpty')); return; }

}

const MODE_IC = {sea:'🚢', air:'✈️', parcel:'📦', other:'📦'};
function etaInfo(it){
  if(it.stage === 'done') return {cls:'done', txt:'✔ ' + T('stDone')};
  if(it.stage === 'arrived') return {cls:'arr', txt:'⚓ ' + T('stArrived')};
  if(!it.eta) return {cls:'', txt:T('noEta')};
  const d = Math.round((new Date(it.eta + 'T12:00:00') - new Date(new Date().toDateString() + ' 12:00')) / 864e5);
  const date = new Date(it.eta + 'T12:00:00').toLocaleDateString(LOCALE(), {day:'numeric', month:'short'});
  if(d < 0) return {cls:'late', txt:`${T('etaLate')} ${-d} ${T('days')} · ${date}`};
  if(d === 0) return {cls:'soon', txt:`${T('etaToday')} · ${date}`};
  return {cls: d <= 7 ? 'soon' : '', txt:`${T('etaIn')} ${d} ${T('days')} · ${date}`};
}
function corpMatches(it){
  const f = corpFilter;
  if(f === 'transit' && it.stage !== 'transit') return false;
  if(f === 'week' && !(it.stage === 'transit' && etaInfo(it).cls === 'soon')) return false;
  if(f === 'late' && etaInfo(it).cls !== 'late') return false;
  if(f === 'arrived' && it.stage !== 'arrived') return false;
  if(f === 'done' && it.stage !== 'done') return false;
  if(f === 'mine' && !CORP_FOLLOW.has(it.key)) return false;
  if(['sea','air','parcel'].includes(f) && (it.mode !== f || it.stage === 'done')) return false;
  if(f === 'all' && it.stage === 'done') return false;
  const q = (byId('corpQ')?.value || '').trim().toLowerCase();
  return !q || [it.product, it.number, it.line, it.agent, it.origin, it.dest, it.comment, it.sheet_no, it.live_status].join(' ').toLowerCase().includes(q);
}

  setHTML('corpStats', tile('transit', st.transit, T('inTransit')) + tile('week', st.week, T('thisWeek'))
    + tile('late', st.late, T('late'), (st.late||0) > 0) + tile('arrived', st.arrived, T('arrivedN')));
  const chips = [['all', T('all')], ['sea', '🚢 ' + T('sea')], ['air', '✈️ ' + T('air')], ['parcel', '📦 ' + T('parcel')],
    ['arrived', '⚓ ' + T('arrived')], ['done', '✔ ' + T('doneN')], ['mine', T('myCargo') + (CORP_FOLLOW.size ? ' ' + CORP_FOLLOW.size : '')]];
  setHTML('corpChips', chips.map(([k, l]) => `<button class="chip ${corpFilter===k?'on':'glass'}" onclick="corpFilter='${k}';renderCorp()">${l}</button>`).join(''));
  const q = byId('corpQ'); if(q) q.placeholder = T('corpSearch');
  const list = CORP.filter(corpMatches);
  setHTML('corpList', list.length ? list.map(it => {
    const e = etaInfo(it);

function wxCode(c){

async function wxGet(lat, lon){

    + '&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m'

// All ports in ONE request (Open-Meteo accepts coordinate lists) — fewer calls, no rate limit.
let _wxPortsCache = null;
async function wxPorts(){

  const u = 'https://api.open-meteo.com/v1/forecast?timezone=auto&forecast_days=1'
    + '&latitude=' + WX.ports.map(p => p[1]).join(',') + '&longitude=' + WX.ports.map(p => p[2]).join(',')
    + '&current=temperature_2m,weather_code,wind_speed_10m,wind_gusts_10m&daily=wind_speed_10m_max';
  let d = await (await fetch(u)).json();
  if(!Array.isArray(d)) d = [d];

function wxAlerts(w){
  const out = [], h = w.hourly, now = new Date(w.current.time);
  const idx = Math.max(0, h.time.findIndex(t => new Date(t) >= now));
  const next = [...Array(24).keys()].map(i => i + idx).filter(i => i < h.time.length);
  const rain = next.find(i => h.precipitation_probability[i] >= 60);
  if(rain !== undefined) out.push(['☔', `${T('wxRain')} ${h.time[rain].slice(11,16)} (${h.precipitation_probability[rain]}%)`]);
  const wind = Math.max(...next.map(i => h.wind_speed_10m[i]));
  if(wind >= 40) out.push(['💨', `${T('wxWindAl')} ${Math.round(wind)} ${T('wxKmh')}`]);
  const tmin = Math.min(...next.map(i => h.temperature_2m[i])), tmax = Math.max(...next.map(i => h.temperature_2m[i]));
  if(tmin <= -10) out.push(['🥶', `${T('wxFrost')} ${Math.round(tmin)}°`]);
  if(tmax >= 32) out.push(['🥵', `${T('wxHeat')} ${Math.round(tmax)}°`]);
  return out;
}
function wxPortFlag(w){

  if(w.current.weather_code >= 95 || wind >= 62) return ['bad', T('wxStorm')];
  if(wind >= 40 || w.current.weather_code >= 80) return ['warn', T('wxWarn')];
  return ['ok', T('wxOk')];
}

async function refreshView(){
  switch(cur){
    case 'today': loaded.today = false; return loadToday();
    case 'feed': return fetchFeed(true);
    case 'strikes': return fetchStrikes(true);
    case 'markets': return fetchMarkets();
    case 'currencies': _currLoaded = false; return loadCurrencies();
    case 'reports': TODAY.digest = null; byId('rlist').innerHTML = ''; return loadReports();
    case 'tracking': if(_trkPane === 'corp'){ _corpLoaded = 0; return loadCorp(); } return loadSavedShipments();
    case 'weather': _wxCache = {}; _wxPortsCache = null; return renderWeather();
    case 'warehouse': _whLoaded = false; return loadWarehouse();
    case 'me': await Promise.all([loadFavs(), loadNotes()]); return renderMe();
  }
}
function ptrInit(){
  const ind = byId('ptr'), arrow = ind.firstElementChild;
  let busy = false;
  document.querySelectorAll('.view').forEach(v => {
    let y0 = null, dy = 0;
    v.addEventListener('touchstart', e => { y0 = (!busy && v.scrollTop <= 0 && !_subOpen()) ? e.touches[0].clientY : null; dy = 0; }, {passive: true});
    v.addEventListener('touchmove', e => {
      if(y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if(dy <= 0){ ind.style.opacity = 0; return; }
      const k = Math.min(dy, 110);
      ind.style.transition = 'none';
      ind.style.opacity = Math.min(1, k / 70);
      ind.style.transform = `translateY(${k * 0.6 - 30}px)`;
      arrow.style.transform = `rotate(${k * 3}deg)`;
    }, {passive: true});
    v.addEventListener('touchend', async () => {
      if(y0 === null) return;
      y0 = null;
      ind.style.transition = 'opacity .3s, transform .3s';
      if(dy < 75){ ind.style.opacity = 0; ind.style.transform = 'translateY(-50px)'; return; }
      busy = true; hap('medium');
      ind.style.transform = 'translateY(18px)'; ind.classList.add('spin');
      try{ await refreshView(); }catch{}
      ind.classList.remove('spin'); ind.style.opacity = 0; ind.style.transform = 'translateY(-50px)';
      busy = false;
    });
  });
}

async function loadCurrencies(){
  _currLoaded = true;
  const list = document.getElementById('curr-list');
  if(list) list.innerHTML = '<div class="sk" style="height:90px"></div>'.repeat(6);
  try{
    if(_currPrefs === null) await loadUserCurrencyPrefs();
    const r = await fetch('/api/webapp/currencies');
    const d = await r.json();
    if(d.ok){
      _allCurrData = d.rates || [];
      _updateCurrViewBtn();
      renderCurrencies(d);
    } else if(list) {
      list.innerHTML = `<div class="empty"><div class="ei">⚠️</div><p>${d.error||UI[lang].loadError}</p></div>`;
    }
  } catch {
    if(list) list.innerHTML = `<div class="empty"><div class="ei">⚠️</div><p>${UI[lang].loadError}</p></div>`;
  }
  setTimeout(()=>{ _currLoaded=false; if(cur==='currencies') loadCurrencies(); }, 15*60*1000);
}

function renderCurrencies(data){
  _destroyCurrCharts();
  const list = document.getElementById('curr-list');
  if(!list) return;
  list.className = 'curr-list ' + _currViewMode;
  list.innerHTML = '';
  const prefs = (_currPrefs && _currPrefs.length) ? _currPrefs : _CURR_DEFAULT_CODES;
  const rates = (data && data.rates) ? data.rates : _allCurrData;
  const ordered = prefs.map(code => rates.find(c => c.code === code)).filter(Boolean);
  if(!ordered.length){
    list.innerHTML = `<div class="empty" style="grid-column:span 3"><div class="ei">📭</div><p>${UI[lang].noData}</p></div>`;
  } else if(_currViewMode === 'compact'){
    ordered.forEach(c => list.appendChild(_mkCurrCompactCard(c)));
  } else {
    ordered.forEach(c => { const card = _mkCurrChartCard(c); list.appendChild(card); _loadCurrChart(c.code); });
  }
  const ft = document.getElementById('curr-footer');
  if(ft && data && data.updated_at) ft.textContent = 'НБУ · ' + data.updated_at;
}

function _mkCurrCompactCard(c){
  const div = document.createElement('div');
  div.className = 'glass curr-card compact';
  div.innerHTML =
    `<button class="curr-remove-btn" onclick="removeCurrCard(event,'${esc(c.code)}')" title="Видалити">✕</button>
     <div class="curr-code">${esc(c.symbol)} ${esc(c.code)}</div>
     <div class="curr-name">${esc(c.name)}</div>
     <div class="curr-rate">${c.rate_uah.toFixed(2)} ₴</div>
     <div class="curr-label">${esc(c.label)}</div>`;
  return div;
}

function _mkCurrChartCard(c){
  const div = document.createElement('div');
  div.className = 'glass curr-card chart';
  div.innerHTML =
    `<button class="curr-remove-btn" onclick="removeCurrCard(event,'${esc(c.code)}')" title="Видалити">✕</button>
     <div class="curr-chart-hdr">
       <div class="curr-chart-info">
         <div class="curr-chart-code">${esc(c.symbol)} ${esc(c.code)}</div>
         <div class="curr-chart-name">${esc(c.name)}</div>
       </div>
       <div class="curr-chart-rate">${c.rate_uah.toFixed(2)} ₴</div>
     </div>
     <div class="curr-chart-area" id="curr-ca-${c.code}">
       <div class="curr-chart-fallback">⏳</div>
     </div>`;
  return div;
}

async function _loadCurrChart(code){
  if(_currChartCache[code]){
    _drawCurrChart(code, _currChartCache[code]); return;
  }
  try{
    const r = await fetch('/api/webapp/currency-chart/'+code);
    const d = await r.json();
    _currChartCache[code] = d;
    _drawCurrChart(code, d);
  } catch {
    const area = byId('curr-ca-'+code);
    if(area) area.innerHTML = `<div class="curr-chart-fallback">${UI[lang].chartUnavailable||'Chart unavailable'}</div>`;
  }
}

function _drawCurrChart(code, d){
  const area = byId('curr-ca-'+code); if(!area) return;
  if(!d || !d.ok || !d.prices || !d.prices.length){
    area.innerHTML = `<div class="curr-chart-fallback">${UI[lang].chartUnavailable||'Chart unavailable'}</div>`; return;
  }
  area.innerHTML = `<canvas id="curr-cv-${code}"></canvas>`;
  const ctx = document.getElementById('curr-cv-'+code); if(!ctx) return;
  const prices = d.prices;
  const {tc, gc, bg, up, down} = chartColors();
  const lineCol = prices[prices.length-1]>=prices[0]?up:down;
  if(_currChartInstances[code]){ try{_currChartInstances[code].destroy();}catch{} }

// ── Drag-and-drop reorder ──
let _mkDragState = null;
function _initMkDrag(grid){
  if(grid._mkDragInited) return;
  grid._mkDragInited = true;
  grid.addEventListener('pointerdown',  _mkOnPD, {passive:true});
  grid.addEventListener('pointermove',  _mkOnPM, {passive:true});
  grid.addEventListener('pointerup',    _mkOnPU, {passive:true});
  grid.addEventListener('pointercancel',_mkOnPC, {passive:true});
}
function _mkOnPD(e){
  if(!_mkEditMode) return;
  const card = e.target.closest('.pcard');
  if(!card || e.target.closest('.pcard-del')) return;
  e.currentTarget.setPointerCapture(e.pointerId);
  _mkDragState = {grid:e.currentTarget, from:card, over:null, moved:false, sx:e.clientX, sy:e.clientY};
}
function _mkOnPM(e){
  const s = _mkDragState; if(!s) return;
  if(!s.moved && Math.hypot(e.clientX-s.sx, e.clientY-s.sy)<8) return;
  s.moved = true;
  s.from.classList.add('dragging');
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el?.closest('.pcard[data-key]');
  if(s.over) s.over.classList.remove('drag-over');
  s.over = (target && target !== s.from) ? target : null;
  if(s.over) s.over.classList.add('drag-over');
}
function _mkOnPU(e){
  const s = _mkDragState; if(!s) return;
  s.from.classList.remove('dragging');
  if(s.over) s.over.classList.remove('drag-over');
  if(s.moved && s.over){
    const fk=s.from.dataset.key, tk=s.over.dataset.key;
    const fi=_mkPrefs.indexOf(fk), ti=_mkPrefs.indexOf(tk);
    if(fi>=0 && ti>=0){ _mkPrefs.splice(fi,1); _mkPrefs.splice(ti,0,fk); }
    mkData = _mkPrefs.map(k=>_allMkData.find(m=>m.key===k)).filter(Boolean);
    renderGrid(mkData);
    saveUserMkPrefs();
  }
  _mkDragState = null;
}
function _mkOnPC(e){
  const s = _mkDragState; if(!s) return;
  s.from.classList.remove('dragging');
  if(s.over) s.over.classList.remove('drag-over');
  _mkDragState = null;
}

// Safe tracking number normalizer -- pure ASCII, all Unicode as \uXXXX escapes.
function normalizeTrackingNumber(raw){
  return String(raw || '')
    .replace(/[\s\u0020\u00A0\u200B\u200C\u200D\u200E\u200F\u202F\u205F\u3000\uFEFF\u002D\u2010\u2011\u2012\u2013\u2014\u2015]/g, '')
    .toUpperCase();
}

async function doTrackContainer(){
  const raw = document.getElementById('trk-cnt-num').value.trim();
  if(!raw){ document.getElementById('trk-cnt-num').focus(); return; }
  const num = normalizeTrackingNumber(raw);
  const res = document.getElementById('trk-cnt-result');
  res.innerHTML =
    `<div class="trk-loading">
       <div class="trk-radar">
         <div class="trk-radar-ring"></div>

         <div class="trk-radar-center">🚢</div>
       </div>
       <div class="trk-loading-txt">${esc(UI[lang].trkSearching)}</div>
     </div>`;
  try{
    const r = await fetch(`/api/webapp/track?number=${encodeURIComponent(num)}&carrier=auto`);
    const data = await r.json();
    // Always build ok=true _lastTrkData so Save button always works
    _lastTrkData = {
      ...(data.ok ? data : {}),
      ok: true, type: 'container', number: num,
      carrier: data.carrier || data.line || _trkCntLine || '',
      line:    data.line    || data.carrier || _trkCntLine || '',
      tracking_url: data.tracking_url || '',
      status: data.status || '',
